name: Create Release with Automated Notes

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on semantic version tags like v1.0.0, v2.1.3

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for changelog generation

      - name: Get previous tag
        id: previoustag
        run: |
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p')
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, using first commit"
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREVIOUS_TAG"

      - name: Generate changelog
        id: changelog
        run: |
          echo "# What's Changed" > changelog.md
          echo "" >> changelog.md
          
          # Get commits between tags
          COMMITS=$(git log ${{ steps.previoustag.outputs.tag }}..HEAD --pretty=format:"%s|%h" --no-merges)
          
          # Categorize commits
          echo "## ✨ Features" >> changelog.md
          echo "$COMMITS" | grep -iE "^feat|^feature" | sed 's/\(.*\)|\(.*\)/- \1 (\2)/' >> changelog.md || echo "- No new features" >> changelog.md
          echo "" >> changelog.md
          
          echo "## 🐛 Bug Fixes" >> changelog.md
          echo "$COMMITS" | grep -iE "^fix|^bugfix" | sed 's/\(.*\)|\(.*\)/- \1 (\2)/' >> changelog.md || echo "- No bug fixes" >> changelog.md
          echo "" >> changelog.md
          
          echo "## 📚 Documentation" >> changelog.md
          echo "$COMMITS" | grep -iE "^docs|^doc" | sed 's/\(.*\)|\(.*\)/- \1 (\2)/' >> changelog.md || echo "- No documentation updates" >> changelog.md
          echo "" >> changelog.md
          
          echo "## 🔧 Other Changes" >> changelog.md
          echo "$COMMITS" | grep -viE "^feat|^feature|^fix|^bugfix|^docs|^doc" | sed 's/\(.*\)|\(.*\)/- \1 (\2)/' >> changelog.md || echo "- No other changes" >> changelog.md
          
          # Output for GitHub
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat changelog.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Display changelog
        run: cat changelog.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
          generate_release_notes: true  # Also includes GitHub's auto-generated notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify release created
        run: |
          echo "✅ Release ${{ github.ref_name }} created successfully!"
          echo "📝 View it at: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"